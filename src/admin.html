<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チーム管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>チーム管理</h1>
  <p><a href="index.html">← ホームに戻る</a></p>

  <h2>登録済みチーム</h2>
  <div id="team-list"></div>

  <h2>新規チーム作成</h2>
  <form id="team-form">
    <label>チーム名</label>
    <input type="text" id="team-name" required>
    <label>カラー（例: coral / blue / amber）</label>
    <input type="text" id="team-color">
    <button type="submit" class="primary">チームを作成</button>
  </form>

  <h2>メンバー追加</h2>
  <form id="player-form">
    <label>氏名</label>
    <input type="text" id="player-name" required>
    <label>所属チーム</label>
    <select id="player-team"></select>
    <button type="submit" class="primary">メンバーを追加</button>
  </form>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

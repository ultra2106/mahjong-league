<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>対局結果入力</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>対局結果入力</h1>
  <p><a href="index.html">← ホームに戻る</a></p>

  <form id="game-form">
    <label>対局日</label>
    <input type="date" id="date" required>

    <label>局番号</label>
    <input type="number" id="round_no" value="1" required>

    <div id="player-rows"></div>

    <button type="submit" class="primary">結果を登録</button>
  </form>

  <p id="result-message"></p>

  <script src="js/api.js"></script>
  <script src="js/input.js"></script>
</body>
</html>
